<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="1080" height="1920" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="360" height="640" fill="#fafbf7"/><text x="24" y="30" font-size="12" fill="#173c34" font-weight="600">9:41</text><rect x="304" y="21" width="32" height="11" rx="3" fill="none" stroke="#173c34"/><rect x="306" y="23" width="22" height="7" rx="2" fill="#173c34"/><rect x="0" y="48" width="360" height="64" fill="#ffffff"/><line x1="0" y1="112" x2="360" y2="112" stroke="#d7e2dc"/><circle cx="46" cy="80" r="20" fill="#146b59"/><path d="M46 70l2.5 5 5 2.5-5 2.5-2.5 5-2.5-5-5-2.5 5-2.5z" fill="#ffffff"/><text x="76" y="76" font-size="16" fill="#173c34" font-weight="700">AI assistant</text><text x="76" y="95" font-size="12" fill="#52665f">Ask about your symptoms</text><rect x="24" y="136" width="240" height="66" rx="18" fill="#ffffff" stroke="#d7e2dc"/><text x="40" y="162" font-size="13" fill="#173c34">Hi! Tell me what you are</text><text x="40" y="182" font-size="13" fill="#173c34">noticing and since when.</text><rect x="96" y="222" width="240" height="66" rx="18" fill="#146b59"/><text x="112" y="248" font-size="13" fill="#ffffff">I have had a mild headache</text><text x="112" y="268" font-size="13" fill="#ffffff">for two days.</text><rect x="24" y="308" width="264" height="106" rx="18" fill="#ffffff" stroke="#d7e2dc"/><text x="40" y="334" font-size="13" fill="#173c34">A few questions to help:</text><text x="40" y="358" font-size="13" fill="#52665f">• How is your sleep?</text><text x="40" y="378" font-size="13" fill="#52665f">• Are you drinking enough water?</text><text x="40" y="398" font-size="13" fill="#52665f">• Any other symptoms?</text><rect x="24" y="434" width="96" height="34" rx="17" fill="#edf3eb"/><text x="72" y="456" font-size="12" fill="#146b59" font-weight="700" text-anchor="middle">Sleep</text><rect x="130" y="434" width="96" height="34" rx="17" fill="#edf3eb"/><text x="178" y="456" font-size="12" fill="#146b59" font-weight="700" text-anchor="middle">Hydration</text><rect x="236" y="434" width="100" height="34" rx="17" fill="#edf3eb"/><text x="286" y="456" font-size="12" fill="#146b59" font-weight="700" text-anchor="middle">Other</text><rect x="0" y="560" width="360" height="80" fill="#ffffff"/><line x1="0" y1="560" x2="360" y2="560" stroke="#d7e2dc"/><rect x="24" y="576" width="256" height="44" rx="22" fill="#fafbf7" stroke="#d7e2dc"/><text x="44" y="603" font-size="13" fill="#52665f">Type your question…</text><circle cx="312" cy="598" r="22" fill="#146b59"/><path d="M303 598h16M313 591l7 7-7 7" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
